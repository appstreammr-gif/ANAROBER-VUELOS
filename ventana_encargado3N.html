<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv="ngrok-skip-browser-warning" content="true">
<title>ENCARGADO 3 — MIS VUELOS ASIGNADOS</title>
<script src="https://fanning-canned-nutcase.ngrok-free.dev/socket.io/socket.io.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { 
  min-height:100%; 
  font-family:'Segoe UI',Arial,sans-serif; 
  background:#FFFFFF; 
  color:#000000; 
  font-size:15px; 
}
.contenedor-todo { 
  width:100%; 
  max-width:1000px; 
  margin:0 auto; 
  padding:12px 6px; 
  padding-bottom:35px; 
}
.cabecera { 
  font-size:24px; 
  font-weight:bold; 
  border-bottom:1px solid #666; 
  padding-bottom:10px; 
  margin-bottom:12px; 
  text-align:center; 
}
.estado-conexion { 
  padding:8px 12px; 
  margin-bottom:10px; 
  background:#EEF7FF; 
  border-radius:4px; 
  color:#004488; 
  text-align:center; 
  font-size:16px; 
}
.aviso-alerta { 
  padding:10px 12px; 
  margin-bottom:12px; 
  background:#FFEBEE; 
  border:1px solid #D32F2F; 
  border-radius:4px; 
  color:#D32F2F; 
  font-weight:bold; 
  text-align:center; 
  font-size:16px; 
  display:none; 
}
.aviso-liberar { 
  padding:10px 12px; 
  margin-bottom:15px; 
  background:#E8F5E9; 
  border:1px solid #2E7D32; 
  border-radius:4px; 
  color:#1B5E20; 
  font-weight:bold; 
  text-align:center; 
  font-size:15px; 
}
table { 
  width:100%; 
  border-collapse:separate; 
  border-spacing:2px; 
  margin-bottom:15px; 
  table-layout:fixed; 
}
th { 
  border:none; 
  border-bottom:1px solid #666; 
  padding:10px 4px; 
  text-align:center; 
  font-weight:normal; 
  font-size:14px; 
}
th:nth-child(1) { width:14%; }
th:nth-child(2) { width:18%; }
th:nth-child(3) { width:18%; }
th:nth-child(4) { width:18%; }
th:nth-child(5) { width:22%; }
th:nth-child(6) { width:10%; }
td { 
  border:none; 
  border-bottom:1px solid #DDD; 
  padding:10px 4px; 
  text-align:center; 
  font-size:14px; 
  word-break:break-word; 
}
.matricula-vuelo { 
  font-size:12px; 
  color:#444; 
  margin-top:3px; 
  display:block; 
}
.hora-liberar-tabla { color:#2E7D32; font-weight:bold; font-size:13px; }
.fila-pendiente { cursor:pointer; }
.fila-pendiente:hover { background:#F8F9FA; }
.fila-cerrada { 
  color:#444; 
  background:#FAFAFA; 
  cursor:not-allowed; 
  opacity:0.85; 
}
.estado-cerrado { color:#006633; font-weight:bold; }
.estado-pendiente { color:#CC6600; font-weight:bold; }
.botones { 
  margin-top:10px; 
  display:flex; 
  gap:8px; 
  flex-wrap:wrap; 
  justify-content:center; 
}
button { 
  padding:8px 14px; 
  font-size:15px; 
  border:1px solid #888; 
  border-radius:4px; 
  cursor:pointer; 
}
.btn-guardar { 
  background:#E8F5E9; 
  border-color:#2E7D32; 
  color:#1B5E20; 
}
.btn-cancelar { 
  background:#FFF3E0; 
  border-color:#E65100; 
  color:#E65100; 
}
.modal { 
  position:fixed; 
  top:0; 
  left:0; 
  width:100%; 
  height:100%; 
  background:rgba(0,0,0,0.25); 
  display:none; 
  align-items:center; 
  justify-content:center; 
  padding:15px; 
}
.modal-contenido { 
  background:white; 
  border:1px solid #999; 
  border-radius:6px; 
  padding:20px; 
  width:100%; 
  max-width:480px; 
}
.modal-contenido h4 { 
  margin-bottom:15px; 
  font-size:17px; 
  text-align:center; 
}
.datos-vuelo-modal { 
  padding:12px; 
  margin-bottom:12px; 
  background:#F5F5F5; 
  border-radius:4px; 
  text-align:center; 
  font-size:15px; 
  line-height:1.8; 
}
.campo { margin-bottom:12px; }
label { 
  display:block; 
  margin-bottom:4px; 
  font-weight:500; 
}
input, textarea { 
  width:100%; 
  padding:8px; 
  border:1px solid #999; 
  border-radius:4px; 
  font-size:15px; 
}
textarea { min-height:80px; resize:vertical; }
.pie-pagina { 
  position:fixed; 
  bottom:0; 
  left:0; 
  width:100%; 
  text-align:center; 
  padding:6px; 
  font-size:12px; 
  color:#666; 
  background:#FFF; 
  border-top:1px solid #EEE; 
}
</style>
</head>
<body>
<div class="contenedor-todo">
  <div class="cabecera">✈️ ENCARGADO 3 — MIS VUELOS ASIGNADOS</div>
  <div class="estado-conexion" id="estado">✅ Conectado — esperando vuelos...</div>
  <div class="aviso-alerta" id="alertaGeneral">⚠️ TENÉS VUELOS PENDIENTES — TOCÁ LA FILA PARA COMPLETAR</div>
  
  <table>
    <thead>
      <tr>
        <th>N°<br>VUELO</th>
        <th>HORA<br>SALIDA</th>
        <th>DEBE<br>LIBERAR</th>
        <th>HORA<br>BAJADA</th>
        <th>HORA<br>SUBIDA</th>
        <th>ESTADO</th>
      </tr>
    </thead>
    <tbody id="cuerpoTabla"></tbody>
  </table>
</div>
<div class="pie-pagina">AppStream 2026 — DOLI AEROPARQUE — Encargado 3</div>
<div class="modal" id="formularioCarga">
  <div class="modal-contenido">
    <h4>Completar datos del vuelo</h4>
    <div class="datos-vuelo-modal" id="datosVueloModal"></div>
    <div class="aviso-liberar" id="avisoLiberar"></div>
    
    <div class="campo">
      <label>Hora de Bajada</label>
      <input type="time" id="horaBajada">
    </div>
    <div class="campo">
      <label>Hora de Subida</label>
      <input type="time" id="horaSubida">
    </div>
    <div class="campo">
      <label>Comentario / Observaciones</label>
      <textarea id="comentario" placeholder="Escribí cualquier novedad..."></textarea>
    </div>
    
    <div class="botones">
      <button class="btn-guardar" onclick="guardarYCerrar()">✅ GUARDAR Y CERRAR VUELO</button>
      <button class="btn-cancelar" onclick="cerrarModal()">❌ CANCELAR</button>
    </div>
  </div>
</div>
<script>
const SERVIDOR = 'https://fanning-canned-nutcase.ngrok-free.dev';
const MI_CODIGO = '03'; // ✅ ENCARGADO 3

let misVuelos = [];
let vueloActivo = null;
let intervaloAlerta = null;
let habiaPendientes = false;

// ⏰ CALCULAR LIBERAR = SALIDA - 30 MIN
function calcularLiberar(horaSalida) {
  if (!horaSalida || horaSalida === '—') return '—';
  const [h, m] = horaSalida.split(':').map(Number);
  const fecha = new Date();
  fecha.setHours(h, m - 30, 0, 0);
  const hh = String(fecha.getHours()).padStart(2, '0');
  const mm = String(fecha.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

// 🔊 ALERTA — SOLO NÚMERO
function reproducirAlerta() {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const mensaje = new SpeechSynthesisUtterance();
  mensaje.text = 'Se asignó un nuevo vuelo al Encargado 3';
  mensaje.lang = 'es-AR';
  mensaje.volume = 1;
  mensaje.rate = 1;
  window.speechSynthesis.speak(mensaje);
}

function controlarAlerta() {
  const hayPendientes = misVuelos.some(v => !v.cerrado);
  const alertaGeneral = document.getElementById('alertaGeneral');
  
  if (hayPendientes) {
    alertaGeneral.style.display = 'block';
    if (!habiaPendientes) reproducirAlerta();
    if (!intervaloAlerta) {
      intervaloAlerta = setInterval(() => {
        if (misVuelos.some(v => !v.cerrado)) {
          reproducirAlerta();
        } else {
          detenerAlerta();
        }
      }, 10000);
    }
    habiaPendientes = true;
  } else {
    alertaGeneral.style.display = 'none';
    detenerAlerta();
    habiaPendientes = false;
  }
}

function detenerAlerta() {
  if (intervaloAlerta) {
    clearInterval(intervaloAlerta);
    intervaloAlerta = null;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}

const socket = io(SERVIDOR, { transports: ['websocket', 'polling'] });

socket.on('connect', () => {
  document.getElementById('estado').innerHTML = '✅ Conectado — trayendo tus vuelos...';
  console.log('✅ ENCARGADO 3 CONECTADO');
  pedirMisVuelos();
});

socket.on('disconnect', () => {
  document.getElementById('estado').innerHTML = '❌ Desconectado — recargá la página';
  detenerAlerta();
});

function esMiVuelo(v) {
  const asignado = String(v.encargadoAsignado || v.encargado || '').trim();
  return asignado === MI_CODIGO || asignado === '3';
}

socket.on('listaVuelos', (todosLosVuelos) => {
  misVuelos = todosLosVuelos.filter(esMiVuelo);
  actualizarTabla();
  controlarAlerta();
});

socket.on('vuelosActualizados', (datos) => {
  misVuelos = datos.vuelos.filter(esMiVuelo);
  actualizarTabla();
  controlarAlerta();
});

socket.on('vueloAsignado', (vuelo) => {
  if (esMiVuelo(vuelo)) {
    pedirMisVuelos();
  }
});

socket.on('vueloCerrado', () => {
  pedirMisVuelos();
});

socket.on('limpiezaTotalRealizada', () => {
  misVuelos = [];
  actualizarTabla();
  controlarAlerta();
});

function pedirMisVuelos() {
  socket.emit('pedirTodosMisVuelos', MI_CODIGO);
}

socket.on('vuelos-nuevos-asignados', (datos) => {
  if (String(datos.encargado) === String(MI_CODIGO)) {
    misVuelos = datos.vuelos || [];
    actualizarTabla();
    controlarAlerta();
  }
});

function actualizarTabla() {
  const cuerpo = document.getElementById('cuerpoTabla');
  
  if (misVuelos.length === 0) {
    cuerpo.innerHTML = '<tr><td colspan="6" style="padding:25px; color:#666;">📭 No tenés vuelos asignados</td></tr>';
    return;
  }
  
  cuerpo.innerHTML = misVuelos.map(v => {
    const cerrado = !!v.cerrado;
    const horaSalida = v.horaSalida || v.STA || '—';
    const horaLiberar = calcularLiberar(horaSalida);
    const horaBajada = v.horaBajada || '—';
    const horaSubida = v.horaSubida || '—';
    const comentario = v.comentario || v.observaciones || '—';
    const estadoTexto = cerrado ? '✅ CERRADO' : '⏳ PENDIENTE';
    const estadoClase = cerrado ? 'estado-cerrado' : 'estado-pendiente';
    const filaClase = cerrado ? 'fila-cerrada' : 'fila-pendiente';
    
    return `
      <tr class="${filaClase}" ${!cerrado ? `onclick="abrirModal('${v.nroVuelo || v.vuelo}')"` : ''}>
        <td>
          <strong>${v.nroVuelo || v.vuelo}</strong>
          <span class="matricula-vuelo">${v.matricula || '—'}</span>
        </td>
        <td><strong>${horaSalida}</strong></td>
        <td class="hora-liberar-tabla">${horaLiberar}</td>
        <td>${horaBajada}</td>
        <td>${horaSubida}</td>
        <td class="${estadoClase}">${estadoTexto}</td>
      </tr>
    `;
  }).join('');
}

function abrirModal(nroVuelo) {
  vueloActivo = misVuelos.find(v => (v.nroVuelo || v.vuelo) === nroVuelo);
  if (!vueloActivo) return;
  
  const horaSalida = vueloActivo.horaSalida || vueloActivo.STA || '—';
  const horaLiberar = calcularLiberar(horaSalida);
  
  document.getElementById('datosVueloModal').innerHTML = `
    <strong>Vuelo:</strong> ${vueloActivo.nroVuelo || vueloActivo.vuelo} — ${vueloActivo.matricula || '—'}<br>
    <strong>Posición:</strong> ${vueloActivo.posicion || '—'}<br>
    <strong>Hora Salida:</strong> ${horaSalida}
  `;
  
  // ⏰ AVISO: a qué hora debe liberar
  document.getElementById('avisoLiberar').innerHTML = `
    ⏰ SALIDA: ${horaSalida}<br>
    ✅ DEBE LIBERAR A LAS: ${horaLiberar} (30 minutos antes)
  `;
  
  // CAMPOS VACÍOS — LOS PONE EL ENCARGADO
  document.getElementById('horaBajada').value = '';
  document.getElementById('horaSubida').value = '';
  document.getElementById('comentario').value = '';
  
  document.getElementById('formularioCarga').style.display = 'flex';
}

function cerrarModal() {
  document.getElementById('formularioCarga').style.display = 'none';
  vueloActivo = null;
}

function guardarYCerrar() {
  if (!vueloActivo) return;
  
  const horaSalida = vueloActivo.horaSalida || vueloActivo.STA || '—';
  const horaBajada = document.getElementById('horaBajada').value;
  const horaSubida = document.getElementById('horaSubida').value;
  const comentario = document.getElementById('comentario').value.trim();
  
  socket.emit('cerrarVuelo', {
    nroVuelo: vueloActivo.nroVuelo || vueloActivo.vuelo,
    vuelo: vueloActivo.vuelo,
    fecha: vueloActivo.fecha,
    matricula: vueloActivo.matricula,
    posicion: vueloActivo.posicion,
    horaSalida: horaSalida,
    horaSubida: horaSubida,
    horaBajada: horaBajada,
    comentario: comentario,
    encargadoAsignado: MI_CODIGO,
    cerrado: true
  });
  
  cerrarModal();
}

// Auto-refresco cada 3 segundos
setInterval(pedirMisVuelos, 3000);

// Detener al cerrar la página
window.addEventListener('beforeunload', detenerAlerta);
</script>
</body>
</html>
